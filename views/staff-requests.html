<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Service Requests</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="staff-page">

<header class="staff-header">

    <div>
        <h1>Manage Service Requests</h1>
        <p>View and update student request statuses</p>
    </div>

    <a href="/logout" class="logout-btn">
        Logout
    </a>

</header>

<div class="staff-actions">

    <a href="/staff" class="staff-action-btn">
        Back to Dashboard
    </a>

</div>

<main class="staff-container">

    <section class="staff-card">

        <div
            style="
            display:flex;
            gap:10px;
            margin-bottom:20px;
            flex-wrap:wrap;
            "
        >

            <input
                id="searchKeyword"
                type="text"
                placeholder="Search student, subject or description..."
                style="
                padding:10px;
                flex:1;
                border:1px solid #ccc;
                border-radius:4px;
                "
            >

            <select
                id="filterStatus"
                style="
                padding:10px;
                border:1px solid #ccc;
                border-radius:4px;
                "
            >

                <option value="">
                    All Statuses
                </option>

                <option value="Submitted">
                    Submitted
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Completed">
                    Completed
                </option>

                <option value="Closed">
                    Closed
                </option>

                <option value="Cancelled">
                    Cancelled
                </option>

            </select>

            <select
                id="filterCategory"
                style="
                padding:10px;
                border:1px solid #ccc;
                border-radius:4px;
                "
            >

                <option value="">
                    All Categories
                </option>

                <option value="Academic Advising">
                    Academic Advising
                </option>

                <option value="Registration & Enrollment">
                    Registration & Enrollment
                </option>

                <option value="Financial Aid">
                    Financial Aid
                </option>

                <option value="IT Support">
                    IT Support
                </option>

                <option value="Career Services">
                    Career Services
                </option>

                <option value="Mental Health">
                    Mental Health
                </option>

                <option value="General">
                    General
                </option>

            </select>

        </div>

        <div id="requests"></div>

    </section>

</main>

<script>

let allRequests = [];


async function fetchRequests() {

    const container =
        document.getElementById("requests");

    try {

        const response =
            await fetch("/api/all-requests");

        if (!response.ok) {
            throw new Error("Unable to load service requests.");
        }

        allRequests =
            await response.json();

        renderRequests();

    }

    catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="info">
                Unable to load service requests.
            </div>
        `;

    }

}


function renderRequests() {

    const container =
        document.getElementById("requests");

    container.innerHTML = "";

    const keyword =
        document
            .getElementById("searchKeyword")
            .value
            .trim()
            .toLowerCase();

    const selectedStatus =
        document
            .getElementById("filterStatus")
            .value;

    const selectedCategory =
        document
            .getElementById("filterCategory")
            .value;

    const filtered =
        allRequests.filter((request) => {

            const status =
                normalizeStatus(request.status);

            const matchesKeyword =

                (request.student || "")
                    .toLowerCase()
                    .includes(keyword)

                ||

                (request.subject || "")
                    .toLowerCase()
                    .includes(keyword)

                ||

                (request.issue || "")
                    .toLowerCase()
                    .includes(keyword)

                ||

                String(request.id || "")
                    .toLowerCase()
                    .includes(keyword);

            const matchesStatus =
                selectedStatus
                    ? status === selectedStatus
                    : true;

            const matchesCategory =
                selectedCategory
                    ? request.category === selectedCategory
                    : true;

            return (
                matchesKeyword &&
                matchesStatus &&
                matchesCategory
            );

        });


    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="info">
                No service requests found matching the selected criteria.
            </div>
        `;

        return;

    }


    filtered.forEach((request) => {

        const status =
            normalizeStatus(request.status);

        const submitted =
            request.createdAt
                ? formatDate(request.createdAt)
                : "Not available";

        const updated =
            request.updatedAt
                ? formatDate(request.updatedAt)
                : submitted;


        let attachmentHTML = `
            <span>None</span>
        `;


        if (request.attachment) {

            if (
                typeof request.attachment === "string"
            ) {

                attachmentHTML = `
                    <a
                        href="${escapeHTML(request.attachment)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        View Attachment
                    </a>
                `;

            }

            else if (
                request.attachment.path
            ) {

                attachmentHTML = `
                    <a
                        href="${escapeHTML(request.attachment.path)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        📎 ${escapeHTML(
                            request.attachment.originalName ||
                            "View Attachment"
                        )}
                    </a>
                `;

            }

        }


        let closedHTML = "";


        if (request.closedAt) {

            closedHTML = `
                <p>
                    <strong>Closed:</strong>
                    ${formatDate(request.closedAt)}
                </p>
            `;

        }


        let updateSection = "";


        /*
          Closed requests remain visible to staff,
          but no additional editing/status changes are allowed.
        */
        if (status === "Closed") {

            updateSection = `

                <div class="request-help-text">
                    This request has been closed by the student.
                    The request remains available for history and reference.
                </div>

            `;

        }

        else {

            updateSection = `

                <form
                    action="/update-status"
                    method="POST"
                    class="request-update-form"
                >

                    <input
                        type="hidden"
                        name="id"
                        value="${escapeHTML(request.id)}"
                    >


                    <label>

                        Update Status

                        <select name="status">

                            <option
                                value="Submitted"
                                ${status === "Submitted" ? "selected" : ""}
                            >
                                Submitted
                            </option>

                            <option
                                value="In Progress"
                                ${status === "In Progress" ? "selected" : ""}
                            >
                                In Progress
                            </option>

                            <option
                                value="Completed"
                                ${status === "Completed" ? "selected" : ""}
                            >
                                Completed
                            </option>

                            <option
                                value="Cancelled"
                                ${status === "Cancelled" ? "selected" : ""}
                            >
                                Cancelled
                            </option>

                        </select>

                    </label>


                    <label>

                        Assign To

                        <select name="assignedTo">

                            <option
                                value="Unassigned"
                                ${
                                    request.assignedTo === "Unassigned" ||
                                    !request.assignedTo
                                        ? "selected"
                                        : ""
                                }
                            >
                                Unassigned
                            </option>

                            <option
                                value="IT Department"
                                ${
                                    request.assignedTo === "IT Department"
                                        ? "selected"
                                        : ""
                                }
                            >
                                IT Department
                            </option>

                            <option
                                value="Financial Aid Dept"
                                ${
                                    request.assignedTo === "Financial Aid Dept"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Financial Aid Dept
                            </option>

                            <option
                                value="Academic Advising Dept"
                                ${
                                    request.assignedTo === "Academic Advising Dept"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Academic Advising Dept
                            </option>

                        </select>

                    </label>


                    <label>

                        Staff Notes

                        <textarea
                            name="notes"
                            rows="4"
                            placeholder="Enter comments for the student..."
                        >${escapeHTML(request.notes || "")}</textarea>

                    </label>


                    <button
                        type="submit"
                        class="update-btn"
                    >
                        Save Changes
                    </button>

                </form>

            `;

        }


        container.innerHTML += `

            <div class="request-card">


                <div class="request-top">

                    <h3>
                        ${escapeHTML(
                            request.subject ||
                            "No Subject"
                        )}
                    </h3>

                    <span
                        class="status-badge ${getStatusClass(status)}"
                    >
                        ${escapeHTML(status)}
                    </span>

                </div>


                <p>
                    <strong>Student:</strong>
                    ${escapeHTML(
                        request.student ||
                        "-"
                    )}
                </p>


                <p>
                    <strong>Category:</strong>
                    ${escapeHTML(
                        request.category ||
                        "General"
                    )}
                </p>


                <p>
                    <strong>Assigned To:</strong>
                    ${escapeHTML(
                        request.assignedTo ||
                        "Unassigned"
                    )}
                </p>


                <p>
                    <strong>Submitted:</strong>
                    ${submitted}
                </p>


                <p>
                    <strong>Last Updated:</strong>
                    ${updated}
                </p>


                ${closedHTML}


                <p>
                    <strong>Description:</strong>
                    ${escapeHTML(
                        request.issue ||
                        "-"
                    )}
                </p>


                <p>
                    <strong>Attachment:</strong>
                    ${attachmentHTML}
                </p>


                <p>
                    <strong>Request ID:</strong>
                    ${escapeHTML(request.id)}
                </p>


                <p>
                    <strong>Current Staff Note:</strong>
                    ${escapeHTML(
                        request.notes ||
                        "No notes yet"
                    )}
                </p>


                ${updateSection}


            </div>

        `;

    });

}


document
    .getElementById("searchKeyword")
    .addEventListener(
        "input",
        renderRequests
    );


document
    .getElementById("filterStatus")
    .addEventListener(
        "change",
        renderRequests
    );


document
    .getElementById("filterCategory")
    .addEventListener(
        "change",
        renderRequests
    );


function normalizeStatus(status) {

    if (status === "Pending") {
        return "Submitted";
    }

    if (status === "Resolved") {
        return "Completed";
    }

    return status || "Submitted";

}


function getStatusClass(status) {

    if (status === "Completed") {
        return "status-completed";
    }

    if (status === "In Progress") {
        return "status-inprogress";
    }

    if (status === "Closed") {
        return "status-closed";
    }

    if (status === "Cancelled") {
        return "status-cancelled";
    }

    return "status-submitted";

}


function formatDate(value) {

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "Not available";

    }

    return date.toLocaleString();

}


function escapeHTML(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


fetchRequests();

</script>

</body>

</html>
