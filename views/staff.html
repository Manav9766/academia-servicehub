<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Staff Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="staff-page">

<header class="staff-header">
  <div>
    <h1>Staff Dashboard</h1>
    <p>Manage Student Appointments and Service Requests</p>
  </div>

  <a href="/logout" class="logout-btn">Logout</a>
</header>

<div class="staff-actions">
  <a href="/staff-requests" class="staff-action-btn">Manage Service Requests</a>
</div>

<main class="staff-container">

  <section class="staff-card">
    <h2>Assigned Appointments</h2>
    <p class="section-text">
      View student appointments submitted through the system.
    </p>

    <div id="staffAppointments"></div>
  </section>

  <section class="staff-card">
    <h2>Service Requests</h2>
    <p class="section-text">Recent student service requests are shown below.</p>

    <div id="dashboardRequests"></div>
  </section>

</main>

<script>
async function loadStaffAppointments() {
  const response = await fetch("/api/all-appointments");
  const appointments = await response.json();

  const container = document.getElementById("staffAppointments");
  container.innerHTML = "";

  if (appointments.length === 0) {
    container.innerHTML = `<div class="info">No appointments found.</div>`;
    return;
  }

  appointments.forEach((appointment) => {
    container.innerHTML += `
      <div class="request-card">
        <div class="request-top">
          <h3>${appointment.service}</h3>
          <span class="status-badge status-submitted">
            ${appointment.status || "Scheduled"}
          </span>
        </div>

        <p><strong>Student:</strong> ${appointment.student}</p>
        <p><strong>Date:</strong> ${appointment.date}</p>
        <p><strong>Time:</strong> ${appointment.time || "Not selected"}</p>
        <p><strong>Notes:</strong> ${appointment.notes || "No notes provided"}</p>
        <p><strong>Appointment ID:</strong> ${appointment.id}</p>
      </div>
    `;
  });
}

async function loadDashboardRequests() {
  const response = await fetch("/api/all-requests");
  const requests = await response.json();

  const container = document.getElementById("dashboardRequests");
  container.innerHTML = "";

  if (requests.length === 0) {
    container.innerHTML = `<div class="info">No service requests found.</div>`;
    return;
  }

  requests.slice(0, 3).forEach((request) => {
    container.innerHTML += `
      <div class="request-card">
        <div class="request-top">
          <h3>${request.issue}</h3>
          <span class="status-badge ${getStatusClass(request.status)}">
            ${request.status}
          </span>
        </div>

        <p><strong>Student:</strong> ${request.student}</p>
        <p><strong>Request ID:</strong> ${request.id}</p>
      </div>
    `;
  });
}

function getStatusClass(status) {
  if (status === "In Progress") return "status-inprogress";
  if (status === "Resolved") return "status-completed";
  return "status-submitted";
}

loadStaffAppointments();
loadDashboardRequests();
</script>

</body>
</html>
