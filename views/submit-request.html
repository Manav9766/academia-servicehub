<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Submit Request</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="student-page">

  <header class="student-header">
    <div>
      <h1>Submit Service Request</h1>
      <p>Create a new support request for student services</p>
    </div>

    <a href="/logout" class="logout-btn">
      Logout
    </a>
  </header>

  <main class="student-container">

    <div class="student-actions">
      <a href="/student" class="action-btn secondary">
        Back to Dashboard
      </a>

      <a href="/track-requests" class="action-btn">
        Track Requests
      </a>
    </div>

    <div class="student-card">

      <h2>Request Details</h2>

      <p class="section-text">
        Submit your issue and staff members will review your request.
      </p>

      <form
        action="/submit-request"
        method="POST"
        class="appointment-form"
        enctype="multipart/form-data"
      >

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="Academic Advising">Academic Advising</option>
            <option value="Financial Aid">Financial Aid</option>
            <option value="IT Support">IT Support</option>
            <option value="General">General</option>
          </select>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject" required placeholder="Brief subject..." style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div class="form-group">
          <label for="issue">
            Describe Your Issue
          </label>
          <textarea
            id="issue"
            name="issue"
            rows="6"
            placeholder="Enter your issue here..."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="attachment">Upload Attachment (Optional)</label>
          <input type="file" id="attachment" name="attachment" style="margin-top: 5px;">
        </div>

        <button type="submit" class="primary-btn">
          Submit Request
        </button>

      </form>

    </div>

  </main>

</body>
</html>
