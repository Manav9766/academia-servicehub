<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Submit Request</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="student-page">

  <header class="student-header">
    <div>
      <h1>Submit Service Request</h1>
      <p>Create a new support request for student services</p>
    </div>

    <a href="/logout" class="logout-btn">
      Logout
    </a>
  </header>

  <main class="student-container">

    <div class="student-actions">
      <a href="/student" class="action-btn secondary">
        Back to Dashboard
      </a>

      <a href="/track-requests" class="action-btn">
        Track Requests
      </a>
    </div>

    <div class="student-card">

      <h2>Request Details</h2>

      <p class="section-text">
        Submit your issue and staff members will review your request.
      </p>

      <form
        action="/submit-request"
        method="POST"
        class="appointment-form"
      >

        <div class="form-group">
          <label for="issue">
            Describe Your Issue
          </label>

          <textarea
            id="issue"
            name="issue"
            rows="6"
            placeholder="Enter your issue here..."
            required
          ></textarea>
        </div>

        <button type="submit" class="primary-btn">
          Submit Request
        </button>

      </form>

    </div>

  </main>

</body>
</html>
