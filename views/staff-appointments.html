<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Appointments</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="staff-page">

<header class="staff-header">
  <div>
    <h1>Manage Appointments</h1>
    <p>View and update student appointment bookings</p>
  </div>

  <a href="/logout" class="logout-btn">Logout</a>
</header>

<div class="staff-actions">
  <a href="/staff" class="staff-action-btn">Back to Dashboard</a>
  <a href="/staff-requests" class="staff-action-btn">Manage Service Requests</a>
</div>

<main class="staff-container">

  <section class="staff-card">
    <h2>Booked Appointments</h2>
    <p class="section-text">
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;">
      <input type="text" id="searchAppt" placeholder="Search student or service..." style="padding: 8px; flex: 1; border: 1px solid #ccc; border-radius: 4px;">
      <select id="filterApptStatus" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        <option value="">All Statuses</option>
        <option value="Scheduled">Scheduled</option>
        <option value="Confirmed">Confirmed</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
        <option value="Rescheduled">Rescheduled</option>
      </select>
      <input type="date" id="filterApptDate" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>
    <div id="appointmentsContainer"></div>
  </section>

</main>

<script>
let allAppointments = [];

async function fetchAppointments() {
  const response = await fetch("/api/all-appointments");
  allAppointments = await response.json();
  renderAppointments();
}

function renderAppointments() {
  const container = document.getElementById("appointmentsContainer");
  container.innerHTML = "";

  const searchAppt = document.getElementById("searchAppt").value.toLowerCase();
  const filterApptStatus = document.getElementById("filterApptStatus").value;
  const filterApptDate = document.getElementById("filterApptDate").value;

  const filtered = allAppointments.filter(appointment => {
    const matchesKeyword = (appointment.student || "").toLowerCase().includes(searchAppt) ||
                           (appointment.service || "").toLowerCase().includes(searchAppt);
    const matchesStatus = filterApptStatus ? appointment.status === filterApptStatus : true;
    const matchesDate = filterApptDate ? appointment.date === filterApptDate : true;

    return matchesKeyword && matchesStatus && matchesDate;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div class="info">No appointments found matching the criteria.</div>`;
    return;
  }

  filtered.forEach((appointment) => {
    container.innerHTML += `
      <div class="request-card">
        <div class="request-top">
          <h3>${appointment.service}</h3>
          <span class="status-badge ${getAppointmentStatusClass(appointment.status)}">
            ${appointment.status || "Scheduled"}
          </span>
        </div>

        <p><strong>Student:</strong> ${appointment.student}</p>
        <p><strong>Date:</strong> ${appointment.date}</p>
        <p><strong>Time:</strong> ${appointment.time || "Not selected"}</p>
        <p><strong>Student Notes:</strong> ${appointment.notes || "No notes provided"}</p>
        <p><strong>Appointment ID:</strong> ${appointment.id}</p>

        <form action="/update-appointment-status" method="POST" class="request-update-form">
          <input type="hidden" name="id" value="${appointment.id}">

          <label>
            <strong>Update Status</strong>
            <select name="status">
              <option value="Scheduled" ${appointment.status === "Scheduled" ? "selected" : ""}>Scheduled</option>
              <option value="Confirmed" ${appointment.status === "Confirmed" ? "selected" : ""}>Confirmed</option>
              <option value="Completed" ${appointment.status === "Completed" ? "selected" : ""}>Completed</option>
              <option value="Cancelled" ${appointment.status === "Cancelled" ? "selected" : ""}>Cancelled</option>
              <option value="Rescheduled" ${appointment.status === "Rescheduled" ? "selected" : ""}>Rescheduled</option>
            </select>
          </label>

          <label>
            <strong>Staff Notes / Comments</strong>
            <textarea name="staffNotes" placeholder="Add staff note...">${appointment.staffNotes || ""}</textarea>
          </label>

          <button type="submit" class="update-btn">Update</button>
        </form>
      </div>
    `;
  });
}

document.getElementById("searchAppt").addEventListener("input", renderAppointments);
document.getElementById("filterApptStatus").addEventListener("change", renderAppointments);
document.getElementById("filterApptDate").addEventListener("change", renderAppointments);


function getAppointmentStatusClass(status) {
  if (status === "Completed") return "status-completed";
  if (status === "Cancelled") return "status-cancelled";
  if (status === "Confirmed") return "status-inprogress";
  if (status === "Rescheduled") return "status-inprogress";
  return "status-submitted";
}

fetchAppointments();
</script>

</body>
</html>
