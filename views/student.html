<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="student-page">

<header class="student-header">
  <div>
    <h1>Student Dashboard</h1>
    <p>Welcome to Student Services</p>
  </div>

  <a href="/logout" class="logout-btn">Logout</a>
</header>

<div class="student-container">

  <div class="student-actions">
    <a href="/submit-request" class="action-btn">
      Submit Service Request
    </a>

    <a href="/track-requests" class="action-btn secondary">
      Track Requests
    </a>
  </div>

  <div class="student-card">

    <h2>Book Appointment</h2>

    <form action="/book-appointment" method="POST" class="appointment-form">

      <input
        type="date"
        name="date"
        required
      >

      <select
        name="service"
        required
      >
        <option value="">Select Service</option>
        <option>Financial Aid</option>
        <option>Academic Advising</option>
        <option>Mental Health</option>
      </select>

      <button type="submit">
        Book Appointment
      </button>

    </form>

  </div>

  <div class="student-card">

    <h2>Your Appointments</h2>

    <ul id="appointments"></ul>

  </div>

  <div class="student-card">

    <h2>Your Service Requests</h2>

    <ul id="requests"></ul>

  </div>

</div>

<script>
async function loadAppointments() {

  const response = await fetch("/api/appointments");

  const appointments = await response.json();

  const list = document.getElementById("appointments");

  list.innerHTML = "";

  appointments.forEach(a => {

    list.innerHTML += `
      <li class="card">
        📅 ${a.date}<br>
        🏢 ${a.service}
      </li>
    `;

  });

}

async function loadRequests() {

  const response = await fetch("/api/student-requests");

  const requests = await response.json();

  const list = document.getElementById("requests");

  list.innerHTML = "";

  requests.forEach(r => {

    list.innerHTML += `
      <li class="card">
        <strong>${r.issue}</strong><br>
        Status: ${r.status}
      </li>
    `;

  });

}

loadAppointments();
loadRequests();
</script>

</body>
</html>
