<!DOCTYPE html>
<html>
<head>
  <title>Track Requests</title>
</head>
<body>

<h1>My Service Requests</h1>

<table border="1" cellpadding="10">
  <thead>
    <tr>
      <th>Request ID</th>
      <th>Student</th>
      <th>Issue</th>
      <th>Status</th>
    </tr>
  </thead>

  <tbody id="requestTable"></tbody>
</table>

<br>

<a href="/submit-request">Submit New Request</a>
<br>
<a href="/student">Back to Dashboard</a>

<script>
async function loadRequests() {
  const response = await fetch("/api/student-requests");
  const requests = await response.json();

  const table = document.getElementById("requestTable");
  table.innerHTML = "";

  requests.forEach((r) => {
    table.innerHTML += `
      <tr>
        <td>${r.id}</td>
        <td>${r.student}</td>
        <td>${r.issue}</td>
        <td>${r.status}</td>
      </tr>
    `;
  });
}

loadRequests();
</script>

</body>
</html>
