<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Track Requests</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="student-page">

<header class="student-header">

  <div>
    <h1>My Service Requests</h1>
    <p>Track, edit, or cancel your submitted requests</p>
  </div>

  <a href="/logout" class="logout-btn">
    Logout
  </a>

</header>

<main class="student-container">

<div class="student-actions">

  <a href="/submit-request" class="action-btn">
    Submit New Request
  </a>

  <a href="/student" class="action-btn secondary">
    Back to Dashboard
  </a>

</div>

<div class="student-card">

<div id="requestCards"></div>

</div>

</main>

<script>

async function loadRequests(){

    try{

        const response = await fetch("/api/student-requests");

        const requests = await response.json();

        const container = document.getElementById("requestCards");

        container.innerHTML="";

        if(requests.length===0){

            container.innerHTML=`

            <div class="info" style="text-align:center;padding:20px;">

            No service requests submitted yet.

            </div>

            `;

            return;

        }

        requests.forEach(r=>{

            let attachmentHTML="None";

            if(r.attachment){

                if(typeof r.attachment==="string"){

                    attachmentHTML=`
                    <a href="${r.attachment}" target="_blank">
                    View File
                    </a>
                    `;

                }else{

                    attachmentHTML=`
                    <a href="${r.attachment.path}" target="_blank">
                    📎 ${r.attachment.originalName}
                    </a>
                    `;

                }

            }

            const submitted =
                r.createdAt
                ? new Date(r.createdAt).toLocaleString()
                : "-";

            const updated =
                r.updatedAt
                ? new Date(r.updatedAt).toLocaleString()
                : "-";

            const canModify =
                r.status !== "Cancelled" &&
                r.status !== "Resolved";

            let studentActions = "";

            if(canModify){

                studentActions = `

                <div class="service-request-actions">

                    <form
                    action="/cancel-service-request"
                    method="POST"
                    class="inline-appointment-form">

                        <input
                        type="hidden"
                        name="id"
                        value="${r.id}">

                        <button
                        type="submit"
                        class="cancel-btn">
                        Cancel Request
                        </button>

                    </form>

                    <form
                    action="/edit-service-request"
                    method="POST"
                    class="edit-request-form">

                        <input
                        type="hidden"
                        name="id"
                        value="${r.id}">

                        <label>
                            Category

                            <select
                            name="category"
                            required>

                                <option ${r.category==="Academic Advising" ? "selected" : ""}>
                                Academic Advising
                                </option>

                                <option ${r.category==="Registration & Enrollment" ? "selected" : ""}>
                                Registration & Enrollment
                                </option>

                                <option ${r.category==="Financial Aid" ? "selected" : ""}>
                                Financial Aid
                                </option>

                                <option ${r.category==="IT Support" ? "selected" : ""}>
                                IT Support
                                </option>

                                <option ${r.category==="Career Services" ? "selected" : ""}>
                                Career Services
                                </option>

                                <option ${r.category==="Mental Health" ? "selected" : ""}>
                                Mental Health
                                </option>

                                <option ${r.category==="General" ? "selected" : ""}>
                                General
                                </option>

                            </select>
                        </label>

                        <label>
                            Subject

                            <input
                            type="text"
                            name="subject"
                            value="${escapeHTML(r.subject || "")}"
                            minlength="3"
                            maxlength="120"
                            required>
                        </label>

                        <label>
                            Description

                            <textarea
                            name="issue"
                            rows="4"
                            minlength="10"
                            maxlength="3000"
                            required>${escapeHTML(r.issue || "")}</textarea>
                        </label>

                        <button
                        type="submit"
                        class="reschedule-btn">
                        Save Request Changes
                        </button>

                    </form>

                </div>

                `;

            }

            container.innerHTML += `

            <div class="request-card">

                <div class="request-top">

                    <h3>${escapeHTML(r.subject || "No Subject")}</h3>

                    <span class="status-badge ${getStatusClass(r.status)}">
                    ${r.status}
                    </span>

                </div>

                <p>
                <strong>Request ID:</strong>
                ${r.id}
                </p>

                <p>
                <strong>Category:</strong>
                ${escapeHTML(r.category || "General")}
                </p>

                <p>
                <strong>Description:</strong>
                ${escapeHTML(r.issue || "-")}
                </p>

                <p>
                <strong>Attachment:</strong>
                ${attachmentHTML}
                </p>

                <p>
                <strong>Staff Notes:</strong>
                ${escapeHTML(r.notes || "No notes yet")}
                </p>

                <p>
                <strong>Submitted:</strong>
                ${submitted}
                </p>

                <p>
                <strong>Last Updated:</strong>
                ${updated}
                </p>

                ${studentActions}

            </div>

            `;

        });

    }

    catch(error){

        console.error(error);

    }

}

function getStatusClass(status){

    if(status==="Resolved")
        return "status-completed";

    if(status==="In Progress")
        return "status-inprogress";

    if(status==="Cancelled")
        return "status-cancelled";

    return "status-submitted";

}

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

loadRequests();

</script>

</body>

</html>
