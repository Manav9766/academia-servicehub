<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Track Requests</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="student-page">

<header class="student-header">

  <div>
    <h1>My Service Requests</h1>
    <p>Track your submitted requests and their current status</p>
  </div>

  <a href="/logout" class="logout-btn">
    Logout
  </a>

</header>

<main class="student-container">

<div class="student-actions">

  <a href="/submit-request" class="action-btn">
    Submit New Request
  </a>

  <a href="/student" class="action-btn secondary">
    Back to Dashboard
  </a>

</div>

<div class="student-card">

<table>

<thead>

<tr>

<th>ID</th>
<th>Subject</th>
<th>Category</th>
<th>Description</th>
<th>Attachment</th>
<th>Status</th>
<th>Staff Notes</th>
<th>Submitted</th>

</tr>

</thead>

<tbody id="requestTable"></tbody>

</table>

</div>

</main>

<script>

async function loadRequests(){

    try{

        const response = await fetch("/api/student-requests");

        const requests = await response.json();

        const table = document.getElementById("requestTable");

        table.innerHTML="";

        if(requests.length===0){

            table.innerHTML=`

            <tr>

            <td colspan="8" style="text-align:center;padding:20px;">

            No service requests submitted yet.

            </td>

            </tr>

            `;

            return;

        }

        requests.forEach(r=>{

            let attachmentHTML="None";

            if(r.attachment){

                if(typeof r.attachment==="string"){

                    attachmentHTML=`
                    <a href="${r.attachment}" target="_blank">
                    View File
                    </a>
                    `;

                }else{

                    attachmentHTML=`
                    <a href="${r.attachment.path}" target="_blank">
                    📎 ${r.attachment.originalName}
                    </a>
                    `;

                }

            }

            const submitted =
                r.createdAt
                ? new Date(r.createdAt).toLocaleString()
                : "-";

            table.innerHTML += `

            <tr>

            <td>${r.id}</td>

            <td>${r.subject || "-"}</td>

            <td>${r.category || "General"}</td>

            <td>${r.issue}</td>

            <td>${attachmentHTML}</td>

            <td>

                <span class="status-badge ${getStatusClass(r.status)}">

                ${r.status}

                </span>

            </td>

            <td>${r.notes || "No notes yet"}</td>

            <td>${submitted}</td>

            </tr>

            `;

        });

    }

    catch(error){

        console.error(error);

    }

}

function getStatusClass(status){

    if(status==="Resolved")
        return "status-completed";

    if(status==="In Progress")
        return "status-inprogress";

    if(status==="Cancelled")
        return "status-cancelled";

    return "status-submitted";

}

loadRequests();

</script>

</body>

</html>
